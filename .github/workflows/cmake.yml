name: cmake

on:
  # Push-only, on every branch. This fork takes same-repo PRs exclusively, and
  # GitHub surfaces a branch's push checks on the PR opened from that branch, so
  # a pull_request trigger only duplicates every run on PR branches.
  #
  # '**' rather than '*': in GitHub filter patterns '*' does not match '/', so
  # '*' would silently skip every dusk/... branch this fork works on.
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ubuntu-22-04:
    strategy:
      matrix:
        # No linux-arm64 / linux-armhf here: arm64 is built natively by the
        # ubuntu-arm job below (see the rationale there), and this fork ships
        # arm64 only — there is no 32-bit ARM (armhf) product to build.
        # linux-i686 dropped for the same reason: no 32-bit Linux product.
        #
        # pluginval dropped: replaced by the self-contained plugin-validation
        # job in wayland.yml. The action's `pluginval` target wgets the KXStudio
        # repository package from launchpad.net and installs carla-git, lv2lint
        # and the mod/darkglass LV2 extensions from it — third-party infra this
        # fork does not want to depend on, and the single flakiest step on the
        # board (launchpad times out regularly). The replacement job installs
        # Tracktion pluginval from a pinned, checksummed GitHub release and
        # everything else from the Ubuntu archives.
        target: [linux-x86_64, win32, win64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          dpf_path: .
          suffix: _22_04
          target: ${{ matrix.target }}

  # No ubuntu-24-04 job: the new-toolchain canary lives in build.yml, which
  # builds the whole tree on ubuntu-24.04 under -Werror across every C++ std
  # mode. Rebuilding the same sources here through cmake added no coverage.

  # ---------------------------------------------------------------------------
  # Linux arm64, built NATIVELY on GitHub's ARM runners.
  #
  # This replaces the old `linux-arm64` / `linux-armhf` matrix entries above,
  # which cross-compiled on x86_64 runners. dpf-cmake-action's cross setup does
  # `dpkg --add-architecture arm64`, keeps amd64 pinned to archive.ubuntu.com,
  # and adds ports.ubuntu.com for the :arm64 packages. Multiarch requires the
  # amd64 and :arm64 halves of a package at the *same* version, but the two
  # archives publish on independent schedules — every time they drift, apt
  # cannot satisfy the version-locked -dev packages and aborts with "held broken
  # packages", reddening an otherwise clean commit. Native arm64 runners
  # (ubuntu-*-arm, free for public repos) resolve everything from ports alone,
  # so the two archives can never disagree: the failure class is gone, and the
  # qemu-user-static emulation step goes with it.
  #
  # armhf is not carried over: this fork ships arm64 only (no 32-bit ARM
  # product), and GitHub offers no armhf runner.
  #
  # Scope: this is a build check. Making arm64 binaries *loadable* on older
  # distros is a glibc-floor packaging concern, handled in the product repos by
  # building inside an older-glibc container — deliberately not done here.
  #
  # Why inline steps instead of `uses: distrho/dpf-cmake-action@v1`: the action's
  # native (`linux-x86_64`) dependency and build steps are arch-neutral and are
  # reproduced verbatim below, but its "Fix GitHub's mess (ubuntu-24.04)" step
  # runs for *every* Linux target regardless of arch and rewrites
  # /etc/apt/sources.list.d/ubuntu.sources with `Architectures: amd64 i386`. On
  # an arm64 runner that points apt at architectures ports.ubuntu.com does not
  # serve, so `apt-get update` 404s and the step dies before any build happens.
  # ---------------------------------------------------------------------------
  ubuntu-arm:
    # Single runner, so no matrix (and no fail-fast knob) to carry: 22.04-arm is
    # the product glibc floor, and 24.04-arm only rebuilt the same sources
    # against a newer libc.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup dependencies (native arm64)
        # ports.ubuntu.com (the arm64 archive) is under-resourced and regularly
        # unreachable from GitHub's ARM runners on both IPv6 and IPv4. Swap it
        # for a high-bandwidth mirror (MIT), force IPv4, and retry, so a mirror
        # hiccup doesn't fail CI. Package list matches the action's
        # linux-x86_64 setup step, plus the toolchain bits explicitly.
        run: |
          sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) \
            -exec sed -i 's|ports.ubuntu.com|mirrors.mit.edu|g' {} +
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          ok=0
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -yqq \
              build-essential cmake pkg-config gperf \
              libasound2-dev libdbus-1-dev libgl1-mesa-dev libglib2.0-dev \
              liblo-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
              && { ok=1; break; }
            echo "apt attempt $i failed; retrying in 20s"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "apt failed after 3 attempts"; exit 1; }
      - name: Configure
        # Same in-tree invocation the action uses for linux-x86_64: its
        # CMAKE_EXTRA_ARGS for a non-debug, non-LTO build plus its static
        # libgcc/libstdc++ LDFLAGS. No cross/emulator/VST3-arch overrides —
        # CMake detects aarch64 natively.
        env:
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_MODULE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}" \
              .
      - name: Build
        run: make -j $(nproc)
      - name: Show built files
        run: ls -l bin/

  # No macos-13 or macos-14 job: GitHub is deprecating the 13 image, and
  # macos-15 covers the newer-SDK risk that 14 merely duplicated.
  macos-15:
    strategy:
      matrix:
        # macos-intel dropped: macos-universal already builds the x86_64 slice,
        # so a separate intel-only leg adds nothing.
        target: [macos-universal, macos-10.15]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          dpf_path: .
          suffix: _15
          target: ${{ matrix.target }}

  msvc-win32:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure
      run: |
       cmake -S . -B build -G"Visual Studio 17 2022" -A"Win32" -DCMAKE_BUILD_TYPE="Release"
    - name: Build
      run: cmake --build build --config "Release" -j 2
    - name: Show built files
      working-directory: build/bin
      run: tree
    - uses: actions/upload-artifact@v4
      with:
        name: msvc-win32
        path: build/bin/

  msvc-win64:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure CMake
      run: |
       cmake -S . -B build -G"Visual Studio 17 2022" -A"x64" -DCMAKE_BUILD_TYPE="Release"
    - name: Build all
      working-directory: build
      run: cmake --build . --config "Release" -j 2
    - name: Show built files
      working-directory: build/bin
      run: tree
    - uses: actions/upload-artifact@v4
      with:
        name: msvc-win64
        path: build/bin/

  msvc-arm64:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure CMake
      run: |
       cmake -S . -B build -G"Visual Studio 17 2022" -A"ARM64" -DCMAKE_BUILD_TYPE="Release"
    - name: Build all
      working-directory: build
      run: cmake --build . --config "Release" -j 2
    - name: Show built files
      working-directory: build/bin
      run: tree
    - uses: actions/upload-artifact@v4
      with:
        name: msvc-arm64
        path: build/bin/
