name: wayland

# Fork-specific CI for dusk-audio/DPF.
#
# The other CI here (build.yml, cmake.yml) always runs on machines that have the X11
# development files installed, so it only ever exercises the X11 arm of the DGL backend selection.
# The jobs below cover the two things that arm hides:
#   - wayland-only          the Wayland backend actually compiles when X11 dev files are absent,
#                           for both of its variants: OpenGL/stub, and Cairo against a Cairo that
#                           was built without its X11 surfaces (see the tail of that job for why
#                           the distro package cannot be used)
#   - wayland-x11-regression  a dual-stack machine still picks X11, exactly as it did before
# plus two conformance gates that load the built plugins instead of only compiling them:
#   - clap-validation       CLAP, which upstream does not run at all
#   - plugin-validation     VST3 + LV2, replacing the `pluginval` matrix target that cmake.yml used
#                           to hand to upstream's dpf action. That target
#                           pulled the KXStudio archive off launchpad.net and installed carla-git,
#                           lv2lint and the mod/darkglass extensions from it; the job below needs
#                           nothing but the Ubuntu archives and one pinned GitHub release asset.

on:
  # Push-only, on every branch. This fork takes same-repo PRs exclusively, and
  # GitHub surfaces a branch's push checks on the PR opened from that branch, so
  # a pull_request trigger only duplicates every run on PR branches.
  #
  # '**' rather than '*': in GitHub filter patterns '*' does not match '/', so
  # '*' would silently skip every dusk/... branch this fork works on.
  push:
    branches:
      - '**'
  workflow_dispatch:

# Every job here only builds and validates, so nothing needs write access to the repository.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------------------------------------------------
  # Build with the Wayland development files present and the X11 development files absent.
  #
  # A plain runner image cannot be used for this: ubuntu-latest ships libx11-dev, and it cannot simply be
  # apt-removed because half the desktop -dev stack depends on it. A bare container is the only way to get a
  # machine where `pkg-config --exists x11` genuinely fails.

  wayland-only:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      # 1.18.4 (2025-02-14) is the current cairo release; the checksum is upstream's own
      # cairo-1.18.4.tar.xz.sha256sum from cairographics.org. Bump the version and the checksum
      # together, the same way CLAP_VALIDATOR_* and PLUGINVAL_* are bumped below.
      CAIRO_VERSION: 1.18.4
      CAIRO_SHA256: 445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb
      # Outside the source tree's build/ and bin/, so nothing here can be mistaken for a DPF artifact.
      CAIRO_PREFIX: ${{ github.workspace }}/cairo-prefix
    steps:
    # Installed before checkout on purpose: actions/checkout only clones submodules when git is already
    # available, otherwise it silently falls back to the tarball API and dgl/src/pugl-upstream stays empty.
    #
    # Package list matches exactly what Makefile.base.mk probes for the Wayland arm:
    #   wayland-client, wayland-egl, wayland-cursor -> libwayland-dev  (all three .pc files live there)
    #   xkbcommon                                   -> libxkbcommon-dev
    #   egl                                         -> libegl-dev
    #   gl                                          -> libgl-dev       (HAVE_OPENGL; the Wayland arm still
    #                                                                   calls desktop GL entry points)
    #   glesv2                                      -> libgles-dev     (the GLES3 linkage step below links
    #                                                                   libGLESv2 instead of libGL; drags in
    #                                                                   no X11 development files)
    # Deliberately absent: libcairo2-dev. cairo.pc has `Requires.private: x11 xext xrender xcb ...`, so on
    # Debian/Ubuntu Cairo development files cannot exist without X11 development files. HAVE_CAIRO is
    # therefore expected to be No here and dgl builds its gles2/gles3/opengl/opengl3/stub variants only.
    # The Cairo variant is covered separately at the end of this job, against a Cairo built from source
    # with those surfaces switched off; the steps between here and there stay a no-Cairo build.
    - name: Set up dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update -qq
        apt-get install -yq --no-install-recommends \
          build-essential ca-certificates git pkg-config \
          libegl-dev libgl-dev libgles-dev libwayland-dev libxkbcommon-dev
    # Build dependencies for the source-built Cairo the tail of this job needs; see the long comment
    # down there for what it is for and why the distro package cannot be used.
    #
    # They have to be installed here, several steps before anything uses them, because the next step
    # but one rips libx11-dev out with `dpkg --remove --force-depends`. That leaves libegl-dev and
    # libglx-dev with an unsatisfied dependency, and apt refuses to plan any further transaction
    # while the database is in that state ("Unmet dependencies. Try 'apt --fix-broken install'"), so
    # this is the last point in the job where apt-get install still works.
    #
    # Installing them before the X11 checks is what makes those checks cover this list too: not one
    # of these packages depends on libx11-dev today, and "Verify the environment really has no X11"
    # below is what keeps that true if the list ever grows.
    #   curl                    not in the ubuntu:24.04 base image; needed to fetch the tarball
    #   xz-utils                already in the base image, listed so a slimmer one cannot break this
    #   meson, ninja-build      Cairo 1.18 requires meson >= 1.3.0, and noble ships 1.3.2
    #   libpixman-1-dev         Cairo's one mandatory dependency
    #   libpng-dev, zlib1g-dev  the png feature
    #   libfreetype-dev,
    #   libfontconfig-dev       the font backends
    - name: Set up Cairo build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get install -yq --no-install-recommends \
          curl xz-utils meson ninja-build \
          libfontconfig-dev libfreetype-dev libpixman-1-dev libpng-dev zlib1g-dev
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    # libgl-dev depends on libglx-dev which depends on libx11-dev, and libegl-dev depends on libx11-dev
    # directly, so there is no apt line that installs GL/EGL development files without dragging X11
    # development files along. Drop just that one package with dpkg and leave everything it pulled in
    # behind: gl.pc and egl.pc declare no Requires at all, so they keep resolving once x11.pc is gone.
    # libGL.so.1 still needs libX11.so.6 at runtime, and libx11-6 is untouched.
    - name: Remove X11 development files
      run: |
        dpkg --remove --force-depends libx11-dev || true
    - name: Verify the environment really has no X11
      run: |
        status=0
        for mod in x11 xcursor xext xrandr; do
          if pkg-config --exists $mod; then
            echo "::error::${mod}.pc is still installed, this job would not be testing the Wayland arm"
            status=1
          fi
        done
        for mod in egl gl glesv2 wayland-client wayland-cursor wayland-egl xkbcommon; do
          if ! pkg-config --exists $mod; then
            echo "::error::${mod}.pc is missing, the Wayland arm cannot be selected"
            status=1
          fi
        done
        exit $status
    - name: Show detected features
      run: |
        make features | tee features.txt
        assert() {
          grep -qx "$1" features.txt || { echo "::error::expected 'make features' to report '$1'"; exit 1; }
        }
        assert 'HAVE_X11: No'
        assert 'HAVE_WAYLAND: Yes'
        assert 'HAVE_WAYLAND_LIBS: Yes'
        assert 'HAVE_OPENGL: Yes'
        assert 'HAVE_DGL: Yes'
        assert 'HAVE_STUB: Yes'
        assert 'DGL_BACKEND_WAYLAND: Yes'
    - name: Build DGL
      run: |
        make -C dgl -j$(nproc)
    # Config-level detection can be right while the objects still come out wrong, so check the link-time
    # view too: the Wayland backend must be what actually got compiled in.
    - name: Verify the built objects use the Wayland backend
      run: |
        nm --undefined-only build/libdgl-opengl.a > syms.txt
        grep -q 'wl_display_connect' syms.txt \
          || { echo "::error::libdgl-opengl.a does not reference libwayland"; exit 1; }
        grep -q 'xkb_context_new' syms.txt \
          || { echo "::error::libdgl-opengl.a does not reference libxkbcommon"; exit 1; }
        if grep -q 'XOpenDisplay' syms.txt; then
          echo "::error::libdgl-opengl.a still references Xlib"
          exit 1
        fi
    - name: Build example plugins
      run: |
        make -C examples/Meters -j$(nproc)
        make -C examples/Info clap -j$(nproc)
    # Compiling and linking cannot catch this one: the LV2 UI class is a string baked into the turtle by
    # DistrhoPluginLV2export.cpp, picked at compile time from HAVE_X11, so a wrong choice produces a
    # perfectly good binary that no host can open. The turtle has to be generated and read back.
    #
    # Why it must not be ui:X11UI here: every native LV2 UI class means "the host may reparent the widget
    # handle this UI hands back". Wayland has no cross-process reparenting at all, so a Wayland-only build
    # has no window it could give away, and declaring ui:X11UI would only make hosts embed a handle that
    # can never be honoured. The generic ui:UI says "no class you know how to embed", which is exactly the
    # case in which conforming hosts (Ardour, jalv, ...) fall back to ui:showInterface and let the plugin
    # own a floating toplevel -- the path DistrhoUILV2.cpp implements when ui:parent is absent.
    #
    # examples/Meters builds the lv2_sep target above, so the bundle is already linked; only the one-file
    # ttl generator still has to be built. generate-ttl.sh then loads the DSP binary and asks the plugin to
    # describe itself, which needs neither a display nor a compositor.
    - name: Verify the LV2 turtle declares a Wayland-capable UI
      run: |
        make -C utils/lv2-ttl-generator
        ./utils/generate-ttl.sh
        cat bin/d_meters.lv2/*.ttl
        status=0
        # With lv2_sep the UI class lands in manifest.ttl and its extension data in d_meters_ui.ttl.
        # Anchored match rather than a substring search for 'ui:UI': that would also be satisfied by the
        # @prefix line. Note 'ui:X11UI' does not contain 'ui:UI', so the two assertions cannot both pass.
        grep -qE '^[[:space:]]*a ui:UI ;$' bin/d_meters.lv2/manifest.ttl \
          || { echo "::error::manifest.ttl does not declare the UI as the generic ui:UI"; status=1; }
        # Swept over the whole bundle, not just the manifest: any surviving X11UI anywhere would still
        # send a host down the embedding path this build cannot serve.
        if grep -rn 'ui:X11UI' bin/d_meters.lv2/*.ttl; then
          echo "::error::a Wayland-only build still declares ui:X11UI"
          status=1
        fi
        # ui:UI alone only tells the host what the UI is not. showInterface, and the idleInterface it
        # leans on, are the half that says what to do instead, so losing either would turn a floating UI
        # into an unopenable one.
        grep -rq 'ui:showInterface' bin/d_meters.lv2/*.ttl \
          || { echo "::error::the UI no longer declares ui:showInterface"; status=1; }
        grep -rq 'ui:idleInterface' bin/d_meters.lv2/*.ttl \
          || { echo "::error::the UI no longer declares ui:idleInterface"; status=1; }
        exit $status
    # The one point in this fork's CI where DPF links a real GLES library.
    #
    # build.yml has UI_TYPE=gles2/gles3 legs, but they run on machines that have X11 development files, and
    # the X11 arm of Makefile.base.mk hands out `pkg-config --libs gl x11` whatever UI_TYPE says: GLX cannot
    # create an ES context at all, so an X11 GLES build is desktop GL by construction. Only the Wayland arm
    # (EGL + wl_egl_window) switches to glesv2 when USE_GLES2/USE_GLES3 is set, and this container is the
    # only runner in this repository without X11 development files, so it is the only job that can reach
    # that arm. Outside CI the same is true of the wasm target, which this fork does not build.
    #
    # Both halves are asserted because either one alone passes in configurations that are not what this step
    # is for. Checked by hand on a dual-stack machine: an X11 UI_TYPE=gles3 build of this same example does
    # contain the "#version 300 es" shader -- the GLES sources really were compiled -- while still coming out
    # with DT_NEEDED libGL.so.1 and libX11.so.6 and no libGLESv2 whatsoever. So the shader proves the
    # compile-time choice and the DT_NEEDED list proves the link-time one, and neither substitutes for the
    # other.
    #
    # examples/Parameters rather than examples/Meters: Meters was built above with the default UI_TYPE and
    # its bundle is exactly what the turtle assertions just read, so reusing it would clobber a checked
    # artifact. Parameters is built nowhere else in this job, has a UI (FILES_UI) and an lv2_sep target, and
    # is the example build.yml's GLES legs already use. examples/Latency is not a candidate despite being
    # smaller: it has no FILES_UI, so it produces no UI module to inspect.
    #
    # BUILD_DIR_SUFFIX puts every object of this configuration in build-gles3/ so none are shared with the
    # default build above. bin/ has no such separation, so this example's link outputs are removed first:
    # a stale bin/ artifact surviving a configuration flip is a recurring trap in this tree. The container is
    # fresh per run, so today this only guards against a future step building Parameters earlier.
    #
    # No HAVE_X11= override on purpose, even though a dual-stack machine needs one to reproduce this
    # locally. This container genuinely has no x11.pc -- asserted at the top of the job -- so plain make
    # already lands on the Wayland arm, and forcing the variable would hide a regression in which X11
    # development files crept back into the image.
    #
    # Deliberately not covered: running any of it. A GLES context needs a compositor, so runtime coverage
    # would mean bringing up `weston --backend=headless` in this container and driving the UI under it.
    # That is the known next step if it is ever wanted; this step is a build-and-link gate only.
    - name: Verify a Wayland GLES3 build links a real GLES library
      run: |
        rm -rf bin/d_parameters*
        make -C examples/Parameters lv2_sep UI_TYPE=gles3 BUILD_DIR_SUFFIX=-gles3 -j$(nproc)
        ui=bin/d_parameters.lv2/d_parameters_ui.so
        [ -f "$ui" ] || { echo "::error::$ui was not built"; exit 1; }
        # `|| true` so that a module with no dynamic dependencies at all falls through to the assertions
        # below and reports which ones are missing, instead of aborting the step with no message.
        objdump -p "$ui" | grep NEEDED > needed.txt || true
        cat needed.txt
        status=0
        grep -q 'libGLESv2\.so' needed.txt \
          || { echo "::error::the gles3 UI does not link libGLESv2"; status=1; }
        # Matched as 'libGL.so', not 'libGL': the soname libGLESv2.so.2 does not contain the substring
        # 'libGL.so', so this assertion and the one above cannot both be satisfied by the same entry.
        if grep -q 'libGL\.so' needed.txt; then
          echo "::error::the gles3 UI still links desktop libGL"
          status=1
        fi
        # The Wayland client libraries must survive the switch: swapping the GL client API changes which
        # library the drawing calls come from, not how the window is created.
        grep -q 'libwayland-client\.so' needed.txt \
          || { echo "::error::the gles3 UI does not link libwayland-client"; status=1; }
        grep -q 'libwayland-egl\.so' needed.txt \
          || { echo "::error::the gles3 UI does not link libwayland-egl"; status=1; }
        # dgl/src/OpenGL3.cpp emits the "#version 300 es" shader header only under DGL_USE_GLES3, and
        # dgl/src/NanoVG.cpp compiles its GLES3 shaders only under NANOVG_GLES3. Finding the string in the
        # module is what separates "linked glesv2" from "actually built the GLES3 source paths".
        strings "$ui" | grep -qF '#version 300 es' \
          || { echo "::error::the UI has no '#version 300 es' shader, DGL_USE_GLES3 did not select the GLES sources"; status=1; }
        exit $status

    # -----------------------------------------------------------------------------------------------------------------
    # Everything above only ever reaches the OpenGL and stub halves of the Wayland backend. The one
    # file it cannot touch is dgl/src/pugl-extra/wayland_cairo.c: dgl/Makefile builds a Cairo variant
    # only when HAVE_CAIRO is true, and HAVE_CAIRO is `pkg-config --exists cairo`, which cannot
    # succeed in this container. Debian/Ubuntu's cairo.pc carries
    #     Requires.private: ... x11, xext, xrender >= 0.6, xcb >= 1.6, xcb-render >= 1.6, xcb-shm ...
    # so pkg-config resolves that whole graph and fails the moment x11.pc is gone -- and installing
    # libcairo2-dev to make it succeed would put the X11 development files straight back, which is
    # the single thing this job exists to keep out. Until now that left wayland_cairo.c with no CI
    # coverage at all.
    #
    # The escape is that those surfaces are optional in Cairo itself; the distro build merely turns
    # them on. A source build with -Dxlib=disabled -Dxcb=disabled installs a cairo.pc whose
    # Requires.private is libpng/fontconfig/freetype2/pixman-1 and nothing else, and a libcairo.so.2
    # with no X11 entry in DT_NEEDED -- so `pkg-config --exists cairo` resolves here, HAVE_CAIRO
    # turns true, and the container still has no X11 development files anywhere.
    #
    # The enabled feature set is exactly what this repository calls, and no more, because every
    # extra surface lengthens Cairo's own dependency chain:
    #   image surfaces  always built, and they are the whole of wayland_cairo.c: it draws into
    #                   cairo_image_surface_create_for_data() over a wl_shm mapping and hands the
    #                   compositor the matching wl_buffer, which is why there is no
    #                   "Cairo surface for a Wayland window" backend to enable in the first place
    #   png             dgl/src/Cairo.cpp loads images via cairo_image_surface_create_from_png_stream()
    #   freetype +
    #   fontconfig      dgl/src/Cairo.cpp and examples/CairoUI draw labels with cairo_show_text() and
    #                   cairo_text_extents(); with no font backend compiled in, the toy text API can
    #                   only ever resolve to the nil font face
    # Everything else is off: xlib/xcb (the point of the exercise), tee, zlib (script/ps/pdf), glib,
    # spectre, lzo, quartz, dwrite, symbol-lookup and the test suite. DPF calls into none of them.
    #
    # No actions/cache for the built prefix, deliberately. Nothing in this repository caches anything
    # today and this is not the place to be the first, because a cache would barely save anything:
    # measured in this container, the whole thing is ~40s, of which apt-get is ~23s and the fetch,
    # configure and 122-object compile together are ~16s. The apt half is not cacheable by a cached
    # prefix either -- the installed cairo.pc still says `Requires.private: libpng, fontconfig,
    # freetype2, pixman-1`, so `pkg-config --exists cairo` needs those .pc files whether or not
    # libcairo.so.2 had to be rebuilt. And a correct key would have to cover more than the pinned
    # version: Cairo links against the container's pixman/freetype/fontconfig, so a prefix restored
    # under a different base image would be quietly wrong, making the key
    # cairo-${CAIRO_VERSION}-${CAIRO_SHA256}-<container image digest>. Revisit if the build grows.

    - name: Build Cairo without its X11 surfaces
      run: |
        url="https://cairographics.org/releases/cairo-${CAIRO_VERSION}.tar.xz"
        # cairographics.org is a small project server, not a CDN: bound the fetch and retry transient
        # failures instead of hanging the job until the 6-hour default timeout on a stalled connection.
        curl -sSfL --connect-timeout 15 --max-time 300 --retry 3 --retry-delay 5 \
          -o cairo.tar.xz "$url"
        echo "${CAIRO_SHA256}  cairo.tar.xz" | sha256sum -c -
        tar xf cairo.tar.xz
        cd "cairo-${CAIRO_VERSION}"
        # --libdir=lib instead of meson's distro-shaped default, so the PKG_CONFIG_PATH below is one
        # fixed path rather than a guess at the host triplet.
        # --default-library=shared so the DT_NEEDED assertion further down has something to read.
        # --wrap-mode=nodownload because Cairo ships subproject wraps for pixman, libpng, freetype2,
        # fontconfig and friends: without it a missing -dev package turns into a silent network fetch
        # and a bundled copy built with whatever defaults the wrap carries, instead of a hard failure.
        meson setup _build \
          --prefix="$CAIRO_PREFIX" \
          --libdir=lib \
          --buildtype=release \
          --default-library=shared \
          --wrap-mode=nodownload \
          -Dxlib=disabled \
          -Dxcb=disabled \
          -Dxlib-xcb=disabled \
          -Dpng=enabled \
          -Dfreetype=enabled \
          -Dfontconfig=enabled \
          -Dzlib=disabled \
          -Dtee=disabled \
          -Dglib=disabled \
          -Dspectre=disabled \
          -Dlzo=disabled \
          -Dquartz=disabled \
          -Ddwrite=disabled \
          -Dsymbol-lookup=disabled \
          -Dgtk2-utils=disabled \
          -Dtests=disabled \
          -Dgtk_doc=false
        ninja -C _build
        meson install -C _build
    # A Cairo that still had the X11 surfaces would build and install perfectly happily; it would just
    # quietly reintroduce the dependency this whole job is about. Read the result back before letting
    # DPF near it.
    - name: Verify the built Cairo has no X11 surfaces
      run: |
        export PKG_CONFIG_PATH="$CAIRO_PREFIX/lib/pkgconfig"
        status=0
        pkg-config --exists cairo \
          || { echo "::error::cairo.pc was not installed into $CAIRO_PREFIX"; exit 1; }
        # Also catches the reverse mistake, a libcairo2-dev that crept into an apt line above.
        found=$(pkg-config --variable=prefix cairo)
        [ "$found" = "$CAIRO_PREFIX" ] \
          || { echo "::error::pkg-config resolved cairo to $found, not the source build"; status=1; }
        version=$(pkg-config --modversion cairo)
        [ "$version" = "$CAIRO_VERSION" ] \
          || { echo "::error::cairo.pc reports $version, expected the pinned $CAIRO_VERSION"; status=1; }
        requires=$(pkg-config --print-requires-private cairo | tr '\n' ' ')
        echo "cairo $version from $found"
        echo "Requires.private: $requires"
        for mod in x11 xext xrender xcb xcb-render xcb-shm; do
          case " $requires " in
            *" $mod "*)
              echo "::error::cairo.pc still requires $mod, the X11 surfaces were not disabled"
              status=1
              ;;
          esac
        done
        # The trailing soname digits move with the Cairo version, so resolve the file instead of
        # handing objdump a glob: an unmatched glob would reach it as a literal path and turn a
        # missing library into an unexplained objdump failure.
        lib=$(ls -1 "$CAIRO_PREFIX"/lib/libcairo.so.2.* 2>/dev/null | head -n 1)
        [ -n "$lib" ] && [ -f "$lib" ] \
          || { echo "::error::no libcairo.so.2.* in $CAIRO_PREFIX/lib, the Cairo build did not install a shared library"; exit 1; }
        echo "libcairo: $lib"
        objdump -p "$lib" | grep NEEDED
        if objdump -p "$lib" | grep -qE '[[:space:]](libX[a-zA-Z0-9]*|libxcb[a-z-]*)\.so'; then
          echo "::error::libcairo.so links X11 libraries"
          status=1
        fi
        exit $status
    # Same shape as the "Show detected features" step near the top of this job, but with the source
    # built Cairo on PKG_CONFIG_PATH. HAVE_X11 must still be No: the prefix adds a cairo.pc and
    # nothing else, so the backend choice is unchanged and only the Cairo variant is switched on.
    - name: Show detected features with Cairo
      run: |
        export PKG_CONFIG_PATH="$CAIRO_PREFIX/lib/pkgconfig"
        make features | tee features-cairo.txt
        assert() {
          grep -qx "$1" features-cairo.txt || { echo "::error::expected 'make features' to report '$1'"; exit 1; }
        }
        assert 'HAVE_CAIRO: Yes'
        assert 'HAVE_X11: No'
        assert 'HAVE_WAYLAND: Yes'
        assert 'DGL_BACKEND_WAYLAND: Yes'
    # BUILD_DIR_SUFFIX, not the default build/: the steps above already filled that directory from a
    # HAVE_CAIRO=false configuration, and DGL shares OBJS_common between its Cairo and OpenGL
    # variants, so reusing it would archive objects compiled under a different DGL_FLAGS into
    # libdgl-cairo.a. A tree of its own costs seventeen recompiles and removes the question.
    #
    # lv2_sep rather than the example's full target list: it is the only one that links the UI into a
    # binary of its own, so the DT_NEEDED check below reads the UI's libraries and nothing else.
    - name: Build the Cairo example against it
      run: |
        export PKG_CONFIG_PATH="$CAIRO_PREFIX/lib/pkgconfig"
        make -C examples/CairoUI lv2_sep BUILD_DIR_SUFFIX=-cairo -j$(nproc)
    # Two levels, because either one alone can be satisfied by the wrong build:
    #   the archive   proves wayland_cairo.c is the Cairo backend that got compiled in. Its functions
    #                 are static, so they are local symbols; pugl's x11_cairo.c would put
    #                 puglX11Cairo* and an undefined cairo_xlib_surface_create there instead, and
    #                 those two sets cannot both be present.
    #   the binary    proves the link came out Wayland-only. Note wayland-egl is absent on purpose:
    #                 the Cairo backend goes through wl_shm, not EGL, so demanding it here would fail
    #                 a perfectly correct build.
    - name: Verify the Cairo UI uses the Wayland Cairo backend
      run: |
        status=0
        nm build-cairo/libdgl-cairo.a > cairo-syms.txt
        for sym in puglWaylandCairoEnter puglWaylandCairoLeave puglWaylandCairoGetContext; do
          grep -q "$sym" cairo-syms.txt \
            || { echo "::error::libdgl-cairo.a does not contain $sym, the Wayland Cairo backend was not compiled in"; status=1; }
        done
        if grep -qE 'puglX11Cairo|cairo_xlib_surface_create' cairo-syms.txt; then
          echo "::error::libdgl-cairo.a still contains the X11 Cairo backend"
          status=1
        fi
        ui=bin/d_cairoui.lv2/d_cairoui_ui.so
        [ -f "$ui" ] || { echo "::error::$ui was not built"; exit 1; }
        objdump -p "$ui" | grep NEEDED > needed.txt || true
        cat needed.txt
        for lib in libcairo.so.2 libwayland-client.so.0 libwayland-cursor.so.0 libxkbcommon.so.0; do
          grep -q "[[:space:]]${lib}\$" needed.txt \
            || { echo "::error::the Cairo UI does not link $lib"; status=1; }
        done
        if grep -qE '[[:space:]](libX[a-zA-Z0-9]*|libxcb[a-z-]*)\.so' needed.txt; then
          echo "::error::the Cairo UI links X11 libraries"
          status=1
        fi
        exit $status

  # -------------------------------------------------------------------------------------------------------------------
  # Build with both stacks installed and prove X11 is still the one that gets compiled in.
  #
  # This is the regression half of the pair: adding a Wayland backend must not change what an ordinary
  # dual-stack desktop or CI machine produces.

  wayland-x11-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Set up dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq libcairo2-dev libegl-dev libgl-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxkbcommon-dev libxrandr-dev
    - name: Show detected features
      run: |
        make features | tee features.txt
        assert() {
          grep -qx "$1" features.txt || { echo "::error::expected 'make features' to report '$1'"; exit 1; }
        }
        # Both stacks are present, and X11 must win. DGL_BACKEND_WAYLAND is the gate that decides whether
        # any Wayland cflags or libs enter the build at all.
        assert 'HAVE_X11: Yes'
        assert 'HAVE_WAYLAND: Yes'
        assert 'DGL_BACKEND_WAYLAND: No'
    - name: Build DGL
      run: |
        make -C dgl -j$(nproc)
    - name: Verify the built objects use the X11 backend
      run: |
        nm --undefined-only build/libdgl-opengl.a > syms.txt
        grep -q 'XOpenDisplay' syms.txt \
          || { echo "::error::libdgl-opengl.a does not reference Xlib"; exit 1; }
        if grep -qE 'wl_(display|proxy|surface|compositor)_' syms.txt; then
          echo "::error::libdgl-opengl.a references libwayland on a machine that has X11"
          grep -E 'wl_[a-z_]+' syms.txt | sort -u
          exit 1
        fi
    - name: Build example plugins
      run: |
        make -C examples/Meters -j$(nproc)
    # The regression half of the turtle check in the wayland-only job. Both assertions read the same line
    # of manifest.ttl, and the line is chosen from HAVE_X11, so this is the guard that the Wayland arm was
    # given the generic ui:UI without also taking it away from everyone else: ui:X11UI is the class every
    # existing host uses to embed a DPF UI into its plugin rack, and quietly degrading it to ui:UI would
    # move all of them onto the floating showInterface path instead.
    #
    # Costs one extra compilation unit: the step above already links the LV2 bundle, so only the one-file
    # ttl generator is left to build.
    - name: Verify the LV2 turtle still declares an X11 UI
      run: |
        make -C utils/lv2-ttl-generator
        ./utils/generate-ttl.sh
        cat bin/d_meters.lv2/*.ttl
        status=0
        grep -qE '^[[:space:]]*a ui:X11UI ;$' bin/d_meters.lv2/manifest.ttl \
          || { echo "::error::manifest.ttl no longer declares the UI as ui:X11UI"; status=1; }
        # showInterface is declared unconditionally and must stay that way on X11 too: it is what hosts
        # that decline to embed fall back to, and the Wayland change must not have made it conditional.
        grep -rq 'ui:showInterface' bin/d_meters.lv2/*.ttl \
          || { echo "::error::the UI no longer declares ui:showInterface"; status=1; }
        exit $status

  # -------------------------------------------------------------------------------------------------------------------
  # Run the CLAP examples through clap-validator. Upstream CI builds CLAP plugins but never loads them.
  #
  # Every entry left in KNOWN_FAILURES below is a clap-validator 0.3.2 false positive rather than a DPF
  # defect. They all reduce to the validator having no concept of an output parameter: DPF reports its
  # output parameters as CLAP_PARAM_IS_READONLY, the validator then either refuses to send them anything
  # and complains that nothing changed, or expects values that only the host can move to survive a state
  # round-trip. Upstream knows (clap-validator issues #15, #16, #26) and 0.4.1 has already reworked the
  # state tests to drive parameters with flush() instead of process(). The per-entry notes record what was
  # checked, so do not "fix" the examples to satisfy these.
  #
  # The gate is therefore a baseline: any failure that is not in KNOWN_FAILURES below turns the job red.
  # When a baseline entry starts passing the job stays green but prints a notice asking for the list to be
  # trimmed, which keeps the baseline from quietly rotting.

  clap-validation:
    runs-on: ubuntu-latest
    env:
      # 0.4.1 is newer but its asset name embeds a git-describe suffix and its test set has not been
      # baselined here. Bump both the version and KNOWN_FAILURES together.
      CLAP_VALIDATOR_VERSION: 0.3.2
      CLAP_VALIDATOR_SHA256: 1476ed68f5657e76050e0c4f19790c02d819ecc62c35fd465059d21f05169cb1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Set up dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq libgl-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
    - name: Build CLAP plugins
      run: |
        make -C examples/Info clap -j$(nproc)
        make -C examples/Latency clap -j$(nproc)
        make -C examples/Meters clap -j$(nproc)
        ls -l bin/*.clap
    - name: Fetch clap-validator
      run: |
        url="https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/clap-validator-${CLAP_VALIDATOR_VERSION}-ubuntu-18.04.tar.gz"
        curl -sSfL -o clap-validator.tar.gz "$url"
        echo "${CLAP_VALIDATOR_SHA256}  clap-validator.tar.gz" | sha256sum -c -
        mkdir -p clap-validator
        tar xzf clap-validator.tar.gz -C clap-validator
        ./clap-validator/clap-validator --version
    # The validator exits non-zero whenever any test fails, including the baselined ones, so its status is
    # ignored here and the JSON report decides. The report is also checked for completeness, which is what
    # catches the validator dying before it got through the plugins.
    - name: Validate CLAP plugins
      run: |
        ./clap-validator/clap-validator validate --hide-output --json \
          bin/d_info.clap bin/d_latency.clap bin/d_meters.clap > report.json || true
        python3 - <<'PY'
        import json
        import os
        import sys

        KNOWN_FAILURES = {
            # All 13 of Info's parameters are DPF output parameters, so DistrhoPluginCLAP.cpp reports
            # them as CLAP_PARAM_IS_READONLY, and every one of them mirrors host state: BufferSize
            # follows activate(), the rest follow the transport during process().
            'studio.kx.distrho.examples.info': {
                # tests/plugin/params.rs reads all parameters, processes one block, and requires the
                # values to be unchanged. The fuzzer (tests/rng.rs randomize_params_at) only randomizes
                # CLAP_PARAM_IS_AUTOMATABLE parameters, so Info is sent no parameter events whatsoever
                # and still fails: BufferSize moved 1024 -> 512 at activate() and the transport readouts
                # moved during process(). Nothing here can be about namespace checking, and the wrapper
                # does check (DistrhoPluginCLAP.cpp, both the process and flush event loops) -- d_latency
                # passes this same test with real wrong-namespace events sent at it.
                'param-set-wrong-namespace',
                # tests/plugin/state.rs processes audio on instance A, then requires instance B to
                # reproduce A's parameter values from the saved state alone. Info's readouts are all 0
                # until B processes. They cannot be carried in the state either: DPF only calls
                # Plugin::setParameterValue for input parameters, so the wrapper deliberately skips
                # output parameters when saving and loading, and the examples ignore writes to them.
                'state-buffered-streams',
                'state-reproducibility-basic',
                'state-reproducibility-null-cookies',
                # tests/plugin/state.rs calls flush() with the fuzzer's events and then requires the
                # parameter values to have changed. Info has no automatable parameters, so flush() is
                # called with an empty event list and the test asks a no-op to have done something.
                'state-reproducibility-flush',
            },
            # no baselined failures; the key is kept so the completeness check below still requires
            # clap-validator to have reported on this plugin
            'studio.kx.distrho.examples.latency': set(),
            'studio.kx.distrho.examples.meters': {
                # Same check as Info's, failing for the opposite reason. Meters' only automatable
                # parameter is 'color', stepped over 0..1 and defaulting to 0, and the validator's PRNG
                # is fixed (Pcg32::new(1337, 420) in tests/rng.rs), so the random value it flushes is 0 --
                # exactly the value the parameter already holds. Nothing changes and the validator reads
                # that as an unimplemented flush(). Confirmed by starting fColor at 1.0f instead, which
                # makes the test pass with no wrapper change at all.
                'state-reproducibility-flush',
            },
        }
        EXPECTED_LIBRARIES = {'bin/d_info.clap', 'bin/d_latency.clap', 'bin/d_meters.clap'}

        try:
            with open('report.json') as fh:
                report = json.load(fh)
        except (OSError, ValueError) as exc:
            sys.exit('::error::clap-validator did not produce a usable JSON report: %s' % exc)

        libraries = report.get('plugin-library-tests') or {}
        plugins = report.get('plugin-tests') or {}

        status = 0

        # Compared by basename: 0.3.2 echoes the paths it was given, but CLAP requires an absolute
        # path in entry.init(), so a later version reporting canonicalized keys must not read as
        # "library missing". Every expected library lives in bin/, so the names cannot collide.
        reported = {os.path.basename(key) for key in libraries}
        missing = {p for p in EXPECTED_LIBRARIES if os.path.basename(p) not in reported}
        if missing:
            print('::error::clap-validator did not report on %s' % ', '.join(sorted(missing)))
            status = 1
        missing = set(KNOWN_FAILURES) - set(plugins)
        if missing:
            print('::error::clap-validator did not report on plugin %s' % ', '.join(sorted(missing)))
            status = 1

        for group in (libraries, plugins):
            for subject, tests in group.items():
                if not tests:
                    print('::error::clap-validator ran no tests for %s' % subject)
                    status = 1
                    continue
                baseline = KNOWN_FAILURES.get(subject, set())
                # Read through .get rather than indexing: a report shape this does not understand
                # must turn into a reported error, not a traceback and not a silent pass. The five
                # codes are clap-validator's TestStatus enum (src/tests.rs, serialized kebab-case
                # under "code"); anything else means the report format moved and the gate fails
                # closed rather than counting the test as neither passed nor failed.
                KNOWN_CODES = ('success', 'crashed', 'failed', 'skipped', 'warning')
                codes = {}
                details = {}
                for test in tests:
                    name = test.get('name') if isinstance(test, dict) else None
                    result = test.get('status') if isinstance(test, dict) else None
                    code = result.get('code') if isinstance(result, dict) else None
                    if not name or code not in KNOWN_CODES:
                        print('::error::%s: unreadable test entry in the report: %r' % (subject, test))
                        status = 1
                        continue
                    codes[name] = code
                    details[name] = (result.get('details') or '')
                # A crash is a hard failure and is never baselined: KNOWN_FAILURES exists for
                # validator false positives, and a plugin taking the process down is not one.
                for name in sorted(name for name, code in codes.items() if code == 'crashed'):
                    print('::error::%s: %s crashed: %s' % (subject, name, details[name]))
                    status = 1
                failed = {name for name, code in codes.items() if code == 'failed'}
                for name in sorted(failed - baseline):
                    print('::error::%s: %s failed: %s' % (subject, name, details[name]))
                    status = 1
                for name in sorted(baseline - failed):
                    print('::notice::%s: %s now passes, drop it from KNOWN_FAILURES' % (subject, name))
                # Surfaced, not fatal: 'warning' is reserved for timing-dependent tests, and
                # 'skipped' means the preconditions were not met on this runner.
                for name in sorted(name for name, code in codes.items() if code == 'warning'):
                    print('::warning::%s: %s: %s' % (subject, name, details[name]))
                tally = {code: sum(1 for c in codes.values() if c == code) for code in KNOWN_CODES}
                print('%s: %d tests, %d passed, %d failed (%d baselined), %d crashed, %d skipped, %d warned'
                      % (subject, len(tests), tally['success'], len(failed), len(failed & baseline),
                         tally['crashed'], tally['skipped'], tally['warning']))

        sys.exit(status)
        PY

  # -------------------------------------------------------------------------------------------------------------------
  # Load the VST3 and LV2 examples with third-party validators. This replaces the `pluginval` target that
  # used to sit in the ubuntu-22-04 matrix of cmake.yml.
  #
  # Everything here comes from either the Ubuntu archives or a pinned, checksummed GitHub release, so there
  # is no launchpad.net fetch and no KXStudio package set to go stale. What that costs is lv2lint, which
  # has never been packaged for Ubuntu; the LV2 side below is lv2_validate (turtle against the LV2 spec)
  # plus lilv actually discovering and describing the bundles, which is the coverage lv2lint overlapped
  # with anyway.

  plugin-validation:
    # ubuntu-22.04, not ubuntu-latest: 22.04 is this fork's product floor, and it is the image the target
    # this job replaces used to run on.
    runs-on: ubuntu-22.04
    env:
      # v1.0.4 (2024-12-04) is the newest Tracktion release; pluginval_Linux.zip holds a single static
      # binary. Bump the version and the checksum together.
      PLUGINVAL_VERSION: v1.0.4
      PLUGINVAL_SHA256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    # X11 build set, then the validation tools:
    #   xvfb              headless X server, so pluginval's editor tests can open a real DGL window
    #   libgl1-mesa-dri   the swrast driver that makes GLX work on a runner with no GPU
    #   lv2-dev           /usr/bin/lv2_validate, plus the LV2 spec bundles it validates against
    #   sordi             /usr/bin/sord_validate; lv2_validate is a shell wrapper around it and lv2-dev
    #                     declares no dependencies at all, so without this it dies on "command not found"
    #   lilv-utils        lv2ls / lv2info
    - name: Set up dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq \
          libgl-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
          libgl1-mesa-dri lilv-utils lv2-dev sordi xvfb
    # A representative slice rather than every example: Info (large parameter set, output-only ports,
    # modgui), Meters (audio metering with an animated UI), Parameters (every parameter flavour plus
    # presets) and States (state save/restore plus presets). All four build both a VST3 and an LV2.
    #
    # `make lv2` only links the bundle; the turtle is written afterwards by utils/generate-ttl.sh, which
    # loads each bundle and asks the plugin to describe itself.
    - name: Build VST3 and LV2 plugins
      run: |
        for example in Info Meters Parameters States; do
          make -C examples/$example vst3 lv2 -j$(nproc)
        done
        make -C utils/lv2-ttl-generator
        ./utils/generate-ttl.sh
        ls -l bin/
    - name: Fetch pluginval
      run: |
        url="https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
        curl -sSfL -o pluginval.zip "$url"
        echo "${PLUGINVAL_SHA256}  pluginval.zip" | sha256sum -c -
        unzip -q pluginval.zip -d pluginval
        chmod +x pluginval/pluginval
        ./pluginval/pluginval --version
    # Strictness 5 is pluginval's own recommended minimum for host compatibility. The GUI tests are left
    # enabled on purpose: "Editor", "Open editor whilst processing" and "Editor Automation" are the only
    # place any CI job here opens a DGL window, which for this fork is the interesting part. They need a
    # display, hence xvfb-run, and a GL implementation, hence LIBGL_ALWAYS_SOFTWARE pinning Mesa to
    # llvmpipe instead of letting it look for a GPU that is not there. If they ever turn flaky rather
    # than genuinely failing, --skip-gui-tests drops exactly those three and needs no display at all.
    #
    # No baseline list: all four plugins pass clean, unlike the CLAP side above.
    - name: Validate VST3 plugins
      env:
        LIBGL_ALWAYS_SOFTWARE: 1
      run: |
        status=0
        for plugin in bin/d_info.vst3 bin/d_meters.vst3 bin/d_parameters.vst3 bin/d_states.vst3; do
          [ -d "$plugin" ] || { echo "::error::$plugin was not built"; status=1; continue; }
          echo "=== pluginval $plugin"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ./pluginval/pluginval --strictness-level 5 --timeout-ms 120000 --validate "$plugin" \
            || { echo "::error::pluginval failed for $plugin"; status=1; }
        done
        exit $status
    # lv2_validate exits non-zero on any diagnostic, including the baselined ones, so its status is
    # ignored here and the parsed log decides — same shape as the CLAP gate above.
    - name: Validate LV2 turtle
      run: |
        command -v lv2_validate >/dev/null \
          || { echo "::error::lv2_validate is missing; lv2-dev no longer ships it"; exit 1; }
        command -v sord_validate >/dev/null \
          || { echo "::error::sord_validate is missing; lv2_validate cannot run without sordi"; exit 1; }
        for bundle in bin/d_info.lv2 bin/d_meters.lv2 bin/d_parameters.lv2 bin/d_states.lv2; do
          [ -f "$bundle/manifest.ttl" ] \
            || { echo "::error::$bundle has no manifest.ttl, ttl generation did not run"; exit 1; }
        done
        rc=0
        lv2_validate bin/*.lv2/*.ttl > lv2_validate.log 2>&1 || rc=$?
        cat lv2_validate.log
        LV2_VALIDATE_RC="$rc" python3 - <<'PY'
        import os
        import re
        import sys

        # Every diagnostic lv2_validate raises against a stock DPF bundle comes from a vocabulary that is
        # not in the Ubuntu archives. DPF unconditionally emits mod:brand / mod:label / modgui:* and
        # declares the KXStudio programs and control-input-port-change-request extensions, and
        # sord_validate cannot check a property whose .ttl it has never been shown. Installing those
        # vocabularies is precisely the KXStudio dependency this job exists to drop, so a diagnostic that
        # only touches these namespaces is baselined. Anything else - a malformed literal, a misused
        # lv2: property, an unparsable file - is this repository's problem and fails the job.
        EXTERNAL_NAMESPACES = (
            'http://kx.studio/ns/',
            'http://kxstudio.sf.net/ns/',
            'http://moddevices.com/ns/',
        )

        # sord_validate prints one diagnostic as a header line followed by the offending triple, indented
        # over the next few lines, so records are split on the header rather than per line.
        records = []
        try:
            with open('lv2_validate.log') as fh:
                for line in fh:
                    line = line.rstrip('\n')
                    if line.startswith('Found '):
                        break  # trailing summary, not part of the last record
                    if re.match(r'^(error|warning):', line):
                        records.append([line])
                    elif records:
                        records[-1].append(line)
        except OSError as exc:
            sys.exit('::error::could not read the lv2_validate log: %s' % exc)

        status = 0
        baselined = 0

        # The exit status is ignored above because it also fires on the baselined diagnostics, but it
        # is the only signal left when the run failed without printing anything this parser
        # recognises - an unreadable file, a crash, a usage error. Green on no output would mean the
        # turtle was never validated at all.
        try:
            rc = int(os.environ.get('LV2_VALIDATE_RC') or 0)
        except ValueError:
            rc = 1
        if rc and not records:
            print('::error::lv2_validate exited %d without a single parseable diagnostic, '
                  'see the log above' % rc)
            status = 1

        for record in records:
            text = ' '.join('\n'.join(record).split())
            if record[0].startswith('warning:'):
                print('::warning::lv2_validate: %s' % text)
            elif any(ns in text for ns in EXTERNAL_NAMESPACES):
                baselined += 1
            else:
                print('::error::lv2_validate: %s' % text)
                status = 1

        print('lv2_validate: %d diagnostics, %d baselined as external vocabulary' % (len(records), baselined))
        if not baselined:
            print('::notice::no external-vocabulary diagnostics left, EXTERNAL_NAMESPACES can be dropped')
        sys.exit(status)
        PY
    # The turtle being well formed does not mean lilv can find a plugin in it, which is what every real
    # LV2 host does first. LV2_PATH has to point at a directory of bundles and bin/ also holds the .vst3
    # directories, so the .lv2 bundles get symlinked into a directory of their own.
    - name: Discover LV2 bundles with lilv
      run: |
        mkdir -p lv2-path
        for bundle in bin/*.lv2; do
          ln -sfn "$PWD/$bundle" "lv2-path/$(basename "$bundle")"
        done
        export LV2_PATH="$PWD/lv2-path"
        lv2ls | tee discovered.txt
        status=0
        for uri in http://distrho.sf.net/examples/Info \
                   http://distrho.sf.net/examples/Meters \
                   http://distrho.sf.net/examples/Parameters \
                   http://distrho.sf.net/examples/States; do
          if ! grep -qxF "$uri" discovered.txt; then
            echo "::error::lv2ls did not discover $uri"
            status=1
            continue
          fi
          if ! lv2info "$uri" > /dev/null 2> lv2info.err; then
            echo "::error::lv2info failed for $uri"
            cat lv2info.err
            status=1
          elif grep -qi 'error' lv2info.err; then
            echo "::error::lv2info reported errors for $uri"
            cat lv2info.err
            status=1
          elif [ -s lv2info.err ]; then
            echo "::warning::lv2info wrote to stderr for $uri"
            cat lv2info.err
          fi
        done
        exit $status
